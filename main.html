<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expanding Cards</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      margin: 0;
    }

    .container {
      display: flex;
      width: 90vw;
    }

    .panel {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 80vh;
      border-radius: 50px;
      color: #fff;
      cursor: pointer;
      flex: 0.5;
      margin: 10px;
      position: relative;
      transition: flex 0.7s ease-in;
    }

    .panel .img-text {
      font-size: 24px;
      position: absolute;
      bottom: 20px;
      left: 20px;
      margin: 0;
      opacity: 0;
    }

    .panel.active {
      flex: 5;
    }

    .panel.active .img-text {
      opacity: 1;
      transition: opacity 0.3s ease-in 0.4s;
    }
  </style>
</head>
<body>
  <div class="container">
    <div
      class="panel active"
      id="panel-1"
      style="background-image: url('https://unsplash.com')"
    >
      <h3 class="img-text">Explore the world</h3>
    </div>

    <div
      class="panel"
      id="panel-2"
      style="background-image: url('https://unsplash.com')"
    >
      <h3 class="img-text">Wild Forest</h3>
    </div>

    <div
      class="panel"
      id="panel-3"
      style="background-image: url('https://unsplash.com')"
    >
      <h3 class="img-text">City on Winter</h3>
    </div>

    <div
      class="panel"
      id="panel-4"
      style="background-image: url('https://unsplash.com')"
    >
      <h3 class="img-text">Mountain Cloud</h3>
    </div>

    <div
      class="panel"
      id="panel-5"
      style="background-image: url('https://unsplash.com')"
    >
      <h3 class="img-text">Sunny Beach</h3>
    </div>
  </div>

  <script>
    const panels = document.querySelectorAll(".panel");

    panels.forEach((panel) => {
      panel.addEventListener("click", () => {
        removeActiveClasses();
        panel.classList.add("active");
      });
    });

    function removeActiveClasses() {
      panels.forEach((panel) => {
        panel.classList.remove("active");
      });
    }
  </script>
</body>
</html>
